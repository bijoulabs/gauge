name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          # Pinned to the dev snapshot gauge is written against; see build.zig.zon.
          version: 0.17.0-dev.704+b8cb78023
      - name: Test
        run: zig build test
      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe
